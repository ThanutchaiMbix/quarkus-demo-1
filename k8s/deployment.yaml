apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-demo-1
  labels:
    app: quarkus-demo-1
    backstage.io/kubernetes-id: quarkus-demo-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quarkus-demo-1
  template:
    metadata:
      labels:
        app: quarkus-demo-1
        backstage.io/kubernetes-id: quarkus-demo-1
    spec:
      containers:
        - name: quarkus-demo-1
          # tag "latest" เป็นค่าตั้งต้น — Tekton (update-manifests step) จะ bump
          # เป็น commit sha ให้อัตโนมัติทุกครั้งที่ build แล้ว ArgoCD จะ sync ตาม
          image: image-registry.openshift-image-registry.svc:5000/demo/quarkus-demo-1:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: APPLICATION_NAME
              value: "quarkus-demo-1"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: quarkus-demo-1
  labels:
    app: quarkus-demo-1
spec:
  selector:
    app: quarkus-demo-1
  ports:
    - port: 80
      targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# OpenShift Route — URL จะเป็น https://<name>-<namespace>.<clusterAppsDomain>
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: quarkus-demo-1
  labels:
    app: quarkus-demo-1
    backstage.io/kubernetes-id: quarkus-demo-1
spec:
  to:
    kind: Service
    name: quarkus-demo-1
  port:
    targetPort: 80
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
